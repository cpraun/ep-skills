# The claimed 1–3 mm range is built by taking two example values as new end-points
# of the disclosed 0.5–5 mm range. Whether that specific sub-range is directly and
# unambiguously derivable is the T 2/81 / T 1170/02 question. The gate checks a
# finding is reached and in scope; it does not decide the verdict.
rule: "Taxonomy E — numerical range from example end-points (T 2/81, T 1170/02)"
expect_output: true
must_refuse: false
