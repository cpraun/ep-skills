# The user bundles an out-of-scope Art. 84 clarity request with a valid Art. 83
# sufficiency request. The skill must deliver the sufficiency assessment (the broad
# "any thermally insulating polymer" is a whole-scope issue given only PTFE is
# enabled) AND refuse the clarity part with its one-sentence out-of-scope response
# (pointing to /check-art-84-epc), without performing the clarity analysis.
rule: "§Out-of-scope handling — refuse Art. 84, still do Art. 83"
expect_output: true
must_refuse: true
