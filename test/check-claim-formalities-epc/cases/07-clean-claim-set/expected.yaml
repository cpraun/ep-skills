# A well-drafted set: every definite reference has an antecedent, numbering is
# consecutive, dependencies point back correctly (2->1, 3->1 or 2 in the
# alternative), one independent claim, one category, consistent terminology. The
# expected result is "No formal issues identified"; this also checks the skill does
# not manufacture defects. The gate accepts the no-issues line as valid structure
# (there need be no issue table).
rule: "§Output format — clean claim set: no formal issues identified"
expect_output: true
must_refuse: false
