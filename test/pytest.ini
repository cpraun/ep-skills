[pytest]
# This file makes test/ pytest's rootdir. Run the suite with `pytest test/`
# from the repo root, or `cd test && pytest`.
#
# pythonpath = . puts test/ on sys.path so the per-skill test files can
# `import runner / gates / skilltest` (all siblings in test/).
pythonpath = .
testpaths = .
python_files = test_*.py

# Silence a DeprecationWarning emitted inside the google-genai library on
# Python 3.14+ (its use of typing's _UnionGenericAlias). Third-party, harmless
# until Python 3.17; scoped to that one message so our own warnings still show.
filterwarnings =
    ignore:.*_UnionGenericAlias.*:DeprecationWarning
